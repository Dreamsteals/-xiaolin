<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>校邻 · 校园互助便民服务平台</title>
<meta name="description" content="校邻是校园互助便民服务平台：快递代取、闲置流转、资料共享、临时帮扶四个模块，同楼顺手带，跨楼赶时间才计价。">
<meta name="theme-color" content="#083F2A">
<meta property="og:title" content="校邻 · 校园互助便民服务平台">
<meta property="og:description" content="快递代取、闲置流转、资料共享、临时帮扶。同楼顺手带，跨楼赶时间才计价。">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23083F2A'/%3E%3Cpath d='M12 4.5 5 8.4v7.4l7 3.7 7-3.7V8.4z' fill='none' stroke='%23fff' stroke-width='1.6' stroke-linejoin='round'/%3E%3Cpath d='M5 8.4 12 12l7-3.6' fill='none' stroke='%23fff' stroke-width='1.6'/%3E%3C/svg%3E">
<style>
:root{
  --g:#0E6B48; --g-d:#0A4E35; --g-l:#EDF6F1; --g-line:#D8E7DE;
  --sand:#9A7A4E; --sand-l:#F7F1E7;
  --ink:#121913; --ink2:#3A453D; --muted:#78837C;
  --paper:#F7F6F2; --white:#fff;
  --line:#E9E6DF; --line2:#F1EFE9;
  --sh:0 1px 2px rgba(18,25,19,.04), 0 10px 28px -16px rgba(18,25,19,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
a{color:inherit;text-decoration:none}
button{font-family:inherit;font-size:14px;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--g);box-shadow:0 0 0 3px rgba(14,107,72,.09)}
textarea{resize:vertical;min-height:74px}
body{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--paper);color:var(--ink);font-size:14.5px;line-height:1.65;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}

/* ── 侧栏布局 ── */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
aside{position:sticky;top:0;height:100vh;background:var(--white);border-right:1px solid var(--line);padding:22px 16px 16px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 20px}
.mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(145deg,#17865C,#0A4E35);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px -8px rgba(14,107,72,.7)}
.brand .logo{font-size:19px;font-weight:600;letter-spacing:2px;line-height:1.25;display:flex;align-items:center;gap:6px}
.ver{font-size:9px;letter-spacing:1px;font-weight:500;color:var(--g);background:var(--g-l);border:1px solid var(--g-line);border-radius:4px;padding:1px 4px;line-height:1.4}
.brand .slogan{font-size:10.5px;color:var(--muted);letter-spacing:.8px}
.navsec{font-size:10px;letter-spacing:2px;color:#A3ACa5;padding:16px 10px 6px;text-transform:uppercase}
.navi{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;color:var(--ink2);font-size:13.5px;letter-spacing:.3px;transition:.16s;position:relative}
.navi:hover{background:#FAF9F5}
.navi:active{background:#F3F1EA;transform:scale(.985)}
.navi.on{background:var(--g-l);color:var(--g-d);font-weight:600;box-shadow:inset 2px 0 0 var(--g)}
.navi svg{color:var(--muted);flex-shrink:0}
.navi.on svg{color:var(--g)}
.navi .cnt{margin-left:auto;font-size:11px;color:#A6AFA8;letter-spacing:.3px}
.navi.on .cnt{color:var(--g)}
.side-flex{flex:1}
.who{border-top:1px solid var(--line2);padding:14px 8px 0;margin-top:8px}
.who .top{display:flex;align-items:center;gap:9px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--g-l);color:var(--g-d);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12.5px;border:1px solid var(--g-line)}
.who .nm{font-size:13px;font-weight:600;line-height:1.3}
.who .bd{font-size:11px;color:var(--muted)}
.who .kv{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:10px}
.who .kv b{color:var(--ink2);font-weight:600}
.linkbtn{font-size:11.5px;color:var(--muted);letter-spacing:.5px;padding:5px 0}
.linkbtn:hover{color:var(--g)}

/* ── 主区 ── */
main{padding:22px 34px 70px;min-width:0;background:radial-gradient(880px 260px at 100% 0%,rgba(14,107,72,.055),transparent 72%)}
.inner{max-width:1040px;margin:0 auto;animation:pageIn .32s cubic-bezier(.2,.75,.3,1) both}
@keyframes pageIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:24px;flex-wrap:wrap}
.crumb{font-size:11px;letter-spacing:1.6px;color:#9AA49D;text-transform:uppercase}
.spacer{flex:1}
.seg{display:inline-flex;background:#F0EEE8;border-radius:9px;padding:3px}
.seg button{padding:6px 13px;border-radius:7px;font-size:12.5px;color:var(--muted);letter-spacing:.4px;transition:.15s}
.seg button:active{transform:scale(.96)}
.seg button.on{background:#fff;color:var(--g-d);font-weight:600;box-shadow:0 2px 8px -4px rgba(18,25,19,.3)}
.demo-tag{font-size:10.5px;color:#A6AFA8;letter-spacing:.8px;border:1px dashed #D8D5CD;border-radius:6px;padding:2px 6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:10px;background:var(--g);color:#fff;font-weight:600;font-size:13.5px;transition:background .18s,box-shadow .18s,transform .08s;letter-spacing:.3px;position:relative;overflow:hidden}
.btn:hover{background:var(--g-d);box-shadow:0 10px 22px -12px rgba(10,78,53,.8)}
.btn:active{transform:scale(.965);box-shadow:0 4px 10px -6px rgba(10,78,53,.6)}
.btn.ghost{background:transparent;color:var(--g);border:1px solid var(--g-line)}
.btn.ghost:hover{background:var(--g-l);box-shadow:none}
.btn.gray{background:#F1EFE9;color:var(--ink2)}
.btn.gray:hover{background:#E9E6DF;box-shadow:none}
.btn.sm{padding:6px 12px;font-size:12.5px;border-radius:8px}
.btn:focus-visible,.navi:focus-visible,.fchip:focus-visible,.seg button:focus-visible{outline:2px solid rgba(14,107,72,.3);outline-offset:2px}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.42);transform:scale(0);pointer-events:none;animation:rip .55s ease-out forwards}
.btn.gray .rip,.btn.ghost .rip{background:rgba(14,107,72,.16)}
@keyframes rip{to{transform:scale(2.4);opacity:0}}
.link{font-size:12px;color:var(--muted);letter-spacing:.4px;border-bottom:1px solid transparent}
.link:hover{color:var(--g);border-bottom-color:var(--g-line)}

/* ── 排版元素 ── */
.eyebrow{font-size:10px;letter-spacing:2.2px;color:#9AA49D;text-transform:uppercase}
.h1{font-size:20px;font-weight:600;letter-spacing:.5px;line-height:1.4}
.h2{font-size:15.5px;font-weight:600;letter-spacing:.4px}
.lead{font-size:27px;font-weight:600;letter-spacing:.6px;line-height:1.35}
.lead em{font-style:normal;color:var(--g)}
.sub{font-size:12.5px;color:var(--muted);margin-top:4px}
.page-head{display:flex;align-items:flex-end;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.row{display:flex;gap:10px;align-items:center}
.row.between{justify-content:space-between}
.wraprow{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.mt6{margin-top:6px}.mt10{margin-top:10px}.mt14{margin-top:14px}.mt18{margin-top:18px}.mt24{margin-top:24px}
.meta{font-size:12.5px;color:var(--muted)}
.note{font-size:12px;color:var(--muted);line-height:1.7}
.sep{height:1px;background:var(--line2);margin:16px 0}
.dot:before{content:"·";margin:0 8px;color:#C9CFC9}
.mini{font-size:11px;color:#9AA49D;letter-spacing:.4px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:var(--sh);transition:.2s}
.card.hover:hover{transform:translateY(-2px);border-color:var(--g-line);box-shadow:0 2px 3px rgba(18,25,19,.04),0 18px 40px -20px rgba(18,25,19,.22)}
.section{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:20px 22px;box-shadow:var(--sh)}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:5px;background:var(--g-l);color:var(--g-d);font-weight:600;white-space:nowrap;letter-spacing:.3px}
.tag.cash{background:var(--sand-l);color:var(--sand)}
.tag.gray{background:#F3F1EC;color:var(--muted);font-weight:500}
.tag.warn{background:#FBF0ED;color:#A05A45}
.tag.blue{background:#EDF2F8;color:#39628C}
.status{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);white-space:nowrap}
.status i{width:5px;height:5px;border-radius:50%;background:#B9C1BA}
.status.open i{background:#2E8B62}
.status.done i{background:#C9CEC9}

/* 首页 */
.hello .eyebrow{color:#9AA49D}
.hello .lead{margin-top:8px}
.dash{margin-top:20px;border-radius:15px;background:linear-gradient(128deg,#0A4E35 0%,#0E6B48 52%,#177A54 100%);color:#fff;padding:22px 26px;display:flex;align-items:center;gap:26px;position:relative;overflow:hidden;box-shadow:0 20px 44px -28px rgba(10,78,53,.9)}
.dash:before{content:"";position:absolute;inset:0;background:radial-gradient(520px 180px at 92% 0%,rgba(255,255,255,.14),transparent 72%)}
.dash .txt{position:relative;max-width:520px}
.dash h3{font-size:19px;font-weight:600;letter-spacing:.6px}
.dash p{font-size:12px;opacity:.82;margin-top:6px;line-height:1.7}
.dash .metrics{margin-left:auto;display:flex;position:relative}
.dash .metrics>div{padding:0 20px;text-align:center}
.dash .metrics>div:not(:first-child){border-left:1px solid rgba(255,255,255,.16)}
.dash .n{font-size:23px;font-weight:600;line-height:1.2}
.dash .t{font-size:10.5px;opacity:.72;letter-spacing:1.4px;margin-top:2px}

.mod{display:flex;flex-direction:column;padding:17px 18px;cursor:pointer;position:relative;overflow:hidden}
.mod .top{display:flex;align-items:center;gap:8px}
.ico{width:30px;height:30px;border-radius:8px;background:var(--g-l);display:flex;align-items:center;justify-content:center;color:var(--g);flex-shrink:0}
.mod .nm{font-size:13.5px;font-weight:600;letter-spacing:.3px;flex:1}
.mod .cnt{font-size:11px;color:#A6AFA8;white-space:nowrap}
.mod .desc{font-size:12px;color:var(--muted);margin-top:11px;line-height:1.65;min-height:38px}
.mod .go{margin-top:auto;padding-top:12px;font-size:11.5px;color:var(--g);letter-spacing:.5px;display:flex;align-items:center;gap:4px}
.mod:hover .go{gap:8px}
.mod:after{content:"";position:absolute;left:0;top:0;width:2px;height:100%;background:var(--g);opacity:0;transition:.2s}
.mod:hover:after{opacity:.8}

.rec{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line2)}
.rec:last-child{border-bottom:0;padding-bottom:0}
.rec .b{flex:1;min-width:0}
.rec .t{font-size:13.5px;font-weight:600;letter-spacing:.2px}
.rec .m{font-size:11.5px;color:var(--muted);margin-top:2px}
.rec .p{font-size:11.5px;color:var(--sand);white-space:nowrap}
.tl{display:flex;gap:10px;padding:10px 0}
.tl .d{width:5px;height:5px;border-radius:50%;background:var(--g-line);margin-top:8px;flex-shrink:0}
.tl .c{flex:1;font-size:12.5px;line-height:1.65}
.tl .tm{font-size:10.5px;color:#A6AFA8;margin-top:2px}

/* 集市 */
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}
.fchip{padding:6px 12px;border-radius:8px;border:1px solid var(--line);font-size:12px;color:var(--muted);transition:.15s;letter-spacing:.3px;background:transparent}
.fchip:hover{border-color:var(--g-line);color:var(--ink)}
.fchip.on{background:#fff;border-color:var(--g);color:var(--g-d);font-weight:600;box-shadow:0 6px 16px -12px rgba(14,107,72,.7)}
.fchip:active{transform:scale(.97)}
.fchip .c{color:#AEB6B0;margin-left:5px;font-size:11px}
.fchip.on .c{color:var(--g)}
.task{padding:17px 20px}
.task .head{display:flex;align-items:center;gap:8px}
.task .cat{font-size:10.5px;letter-spacing:1.5px;color:#9AA49D;text-transform:uppercase}
.task .title{font-size:16px;font-weight:600;letter-spacing:.4px;margin-top:8px;line-height:1.45}
.task .meta{margin-top:6px}
.task .note{margin-top:8px;color:var(--ink2);font-size:12px;padding-left:9px;border-left:2px solid var(--line)}
.task .foot{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1px solid var(--line2);gap:10px}
.price{font-size:17px;font-weight:600;color:var(--ink);letter-spacing:.3px}
.price small{font-size:10.5px;font-weight:500;color:var(--muted);margin-left:2px}

/* 统计 */
.stat .k{font-size:10.5px;letter-spacing:1.6px;color:var(--muted);text-transform:uppercase}
.stat .n{font-size:25px;font-weight:600;letter-spacing:.5px;line-height:1.25;margin-top:6px}
.stat .n small{font-size:11.5px;color:var(--muted);font-weight:500;margin-left:4px}
.stat .f{font-size:11.5px;color:var(--muted);margin-top:7px}
.bar{height:5px;border-radius:3px;background:#F0EEE8;overflow:hidden;margin-top:11px}
.bar>i{display:block;height:100%;background:var(--g);border-radius:3px}
.bar.warn>i{background:var(--sand)}
.empty{text-align:center;color:var(--muted);padding:48px 10px;font-size:13px;border:1px dashed #DFDCD4;border-radius:14px;background:#fff}

table.tb{width:100%;border-collapse:collapse;font-size:12.5px}
.tb th,.tb td{text-align:left;padding:11px 9px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tb th{color:var(--muted);font-weight:500;font-size:10px;letter-spacing:1.4px;text-transform:uppercase;padding-top:4px}
.tb tr:last-child td{border-bottom:0}
.tb tbody tr{transition:background .15s}
.tb tbody tr:hover td{background:#FCFBF7}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(14px);background:#12201A;color:#fff;padding:11px 19px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.26s;z-index:60;max-width:82vw;text-align:center;box-shadow:0 16px 40px -14px rgba(0,0,0,.45)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;background:rgba(18,28,23,.42);display:none;align-items:center;justify-content:center;padding:24px;z-index:50;backdrop-filter:blur(3px)}
.modal.on{display:flex}
.modal .box{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:500px;max-height:88vh;overflow:auto;box-shadow:0 30px 70px -24px rgba(0,0,0,.4)}
label.f{display:block;font-size:11px;color:var(--muted);margin:14px 0 5px;letter-spacing:1px}
.field-err{color:#A05A45;font-size:11.5px;margin-top:5px}

@media (max-width:980px){
  .app{grid-template-columns:1fr}
  aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;border-right:0;border-bottom:1px solid var(--line);padding:12px 16px;gap:2px}
  aside .brand{padding:0 12px 0 0}
  aside .brand .slogan{display:none}
  aside .navsec{display:none}
  aside .who{border-top:0;padding:0;margin-left:auto;display:flex;align-items:center;gap:8px}
  aside .who .kv{display:none}
  .side-flex{display:none}
  .navi{padding:7px 10px;font-size:12.5px}
  .navi:before{display:none}
  main{padding:18px 16px 50px}
}
@media (max-width:760px){
  .grid,.grid3,.grid4{grid-template-columns:1fr}
  .dash{flex-direction:column;align-items:flex-start;gap:14px}
  .dash .metrics{margin-left:0;width:100%}
  .dash .metrics>div{flex:1;padding:0 6px}
  .side-flex{display:none}
}

/* ══════════ 设计系统层：类型 / 间距 / 圆角 / 动效 统一到 token ══════════ */
:root{
  --g:#0B5F41; --g-d:#083F2A; --g-l:#EEF6F1; --g-line:#D6E4DB;
  --sand:#8A6A3E; --sand-l:#F5EFE4;
  --ink:#111612; --ink2:#39423B; --muted:#6F7B72;
  --paper:#F6F5F1; --white:#FFF;
  --line:#E6E3DB; --line2:#F0EEE7;
  --ease:cubic-bezier(.22,1,.36,1);
  --sh:0 1px 2px rgba(17,22,18,.04), 0 12px 32px -20px rgba(17,22,18,.18);
}
body{font-family:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
  font-size:16px;line-height:24px;background:var(--paper);color:var(--ink);-webkit-text-size-adjust:100%}
h1,h2,h3,h4,.h1,.h2,.lead,.task .title,.metric .n{text-wrap:balance}
p,.sub,.note,.meta,.mod .desc,.tl .c{text-wrap:pretty}

/* 文本样式：Heading / Title / Body / Button / Caption */
.eyebrow{font-size:12px;line-height:16px;letter-spacing:1.6px;font-weight:500;color:var(--muted)}
.crumb{font-size:12px;line-height:16px;letter-spacing:1.4px;color:var(--muted)}
.lead{font-size:30px;line-height:36px;font-weight:600;letter-spacing:0;max-width:680px;margin-top:8px;
  background:linear-gradient(90deg,#0C110D,#5C635A);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead em{color:var(--g);-webkit-text-fill-color:var(--g)}
.h1{font-size:24px;line-height:32px;font-weight:600;letter-spacing:0}
.h2{font-size:18px;line-height:28px;font-weight:600;letter-spacing:0}
.sub{font-size:16px;line-height:24px;color:var(--muted);margin-top:12px;max-width:680px}
.meta{font-size:14px;line-height:20px;color:var(--muted)}
.note{font-size:14px;line-height:20px;color:var(--muted)}
.mini{font-size:12px;line-height:16px;color:var(--muted);letter-spacing:0}
.tag{font-size:12px;line-height:16px;padding:2px 8px;border-radius:6px;letter-spacing:0}
.status{font-size:12px;line-height:16px}
.price{font-size:20px;line-height:28px;letter-spacing:0}
.price small{font-size:12px;margin-left:2px}
.task .title{font-size:18px;line-height:28px;letter-spacing:0}
.task .cat{font-size:12px;letter-spacing:1.4px}
.stat .k{font-size:12px;line-height:16px;letter-spacing:1.4px}
.stat .n{font-size:30px;line-height:36px;margin-top:8px;letter-spacing:-.4px}
.stat .n small{font-size:14px;margin-left:4px}
.stat .f{font-size:14px;line-height:20px;margin-top:8px}
.tb{font-size:14px;line-height:20px}
.tb th{font-size:12px;line-height:16px;letter-spacing:1.4px}
.tl .c{font-size:14px;line-height:20px}
.tl .tm{font-size:12px;line-height:16px}
.rec .t{font-size:16px;line-height:24px}
.rec .m{font-size:12px;line-height:16px}
.rec .p{font-size:14px;line-height:20px}
label.f{font-size:12px;line-height:16px;letter-spacing:1px;margin:16px 0 8px}
.field-err{font-size:14px;line-height:20px;margin-top:8px}

/* 间距：只用 2/4/8/12/16/24/32/40/48/64/80/96 */
main{padding:24px 32px 64px;background:var(--paper)}
aside{padding:24px 16px 16px;gap:4px}
.brand{padding:0 8px 24px;gap:12px}
.brand .logo{font-size:20px;line-height:28px;letter-spacing:2px}
.brand .slogan{font-size:12px;line-height:16px;letter-spacing:.8px}
.ver{font-size:12px;line-height:16px;border-radius:6px;padding:2px 4px;letter-spacing:.5px}
.navsec{font-size:12px;line-height:16px;letter-spacing:1.6px;padding:24px 12px 8px}

.modal .box{border-radius:16px;padding:24px;max-width:520px}

.home-grid{display:grid;grid-template-columns:minmax(0,1fr) 392px;gap:32px;align-items:start}

.hero{max-width:none}

.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:32px}

.modpanel{background:var(--white);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);overflow:hidden;padding:0}

.modpanel .ph .mini{margin-left:auto;font-variant-numeric:tabular-nums}
.modrow{display:flex;align-items:center;gap:12px;padding:14px 24px;border-bottom:1px solid var(--line2);position:relative;transition:background-color .3s var(--ease)}
.modrow:last-of-type{border-bottom:0}
.modrow:hover{background:#FBFAF6}
.modrow .ic{width:36px;height:36px;border-radius:10px;background:var(--g-l);color:var(--g-d);display:flex;align-items:center;justify-content:center;flex:0 0 36px}
.modrow .tx{flex:1;min-width:0}
.modrow .nm{display:block;font-size:16px;line-height:24px;font-weight:600}
.modrow .ds{display:block;font-size:12px;line-height:18px;color:var(--muted);margin-top:2px}
.modrow .ct{font-size:12px;line-height:16px;color:var(--g-d);background:var(--g-l);border:1px solid var(--g-line);border-radius:6px;padding:2px 8px;white-space:nowrap;font-variant-numeric:tabular-nums}
.modrow .chev{display:flex;color:var(--muted);transition:transform .3s var(--ease),color .3s var(--ease)}
.modrow:hover .chev{transform:translateX(3px);color:var(--g-d)}
.modpanel .pf{padding:12px 24px 14px;border-top:1px solid var(--line2);font-size:12px;line-height:18px;color:var(--muted)}
.modpanel .pf b{color:var(--g-d);font-weight:600}

/* 主张区：逐词点亮（收进左栏，不再单独占一条横带） */
.tagline{margin-top:40px;padding:20px 0 0;border-top:1px solid var(--line);max-width:none}
.tagline p{font-size:22px;line-height:32px;font-weight:600;letter-spacing:0;color:var(--ink);margin:0}
.tagline p + p{margin-top:8px}
.tagline .w{display:inline-block;opacity:.28;transform:translateY(4px);

.tagline .w.on{opacity:1;transform:none}

/* 进场：位移 + 淡入，只动 transform / opacity */
.reveal{opacity:0;transform:translateY(32px);transition:opacity .7s var(--ease),transform .7s var(--ease)}

.inner{animation:pageIn .5s var(--ease) both}

/* 隐私态：取件码遮罩 */
.code{font-weight:600;color:var(--ink);letter-spacing:1px}
.lock{display:inline-flex;align-items:center;gap:6px;font-size:12px;line-height:16px;color:var(--muted);

.lock svg{opacity:.65}

.wallet .asset .f{margin-top:12px;font-size:14px;line-height:20px;color:var(--muted)}
.fold{padding:0}

.fold summary .chev{margin-left:auto;display:flex;color:var(--muted);transform:rotate(90deg);transition:transform .3s var(--ease)}
.fold[open] summary .chev{transform:rotate(-90deg)}
.fold[open] summary{padding-bottom:0}
.foldbody{padding:16px 24px 24px}

.fold summary:hover{background:rgba(11,95,65,.045);border-radius:16px}

.entry{display:flex;align-items:center;justify-content:space-between;gap:16px;text-decoration:none;color:var(--ink)}

.rules .r{display:flex;gap:12px;font-size:14px;line-height:20px}
.rules .r b{flex:0 0 20px;color:var(--g-d);font-weight:600}

/* 接单工作台 */

.steps .st i{display:block;height:4px;border-radius:2px;background:#E7E5DE}
.steps .st.on i{background:var(--g)}
.steps .st b{display:block;margin-top:8px;font-size:12px;line-height:16px;font-weight:500;color:var(--muted)}
.steps .st.on b{color:var(--g-d);font-weight:600}
.codebox{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:16px;padding:16px 24px;border-radius:16px;background:#F6F5F1}

.btn:hover:not(:disabled){transform:translateY(-1px)}

.stat .n,.wallet .asset .n,.price,.code,.codebox .cd,.tb td b{font-variant-numeric:tabular-nums}

html{scroll-behavior:smooth}

  if(!db || !db.tasks || !db.user) db = seed();
  db.user.name = ME;
  if(typeof db.credits !== 'number') db.credits = 3;

  save();
}

/* ================= 工具 ================= */
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }
function uid(p){ return p + Math.random().toString(36).slice(2,7) + Date.now().toString(36).slice(-3); }
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window.__tt); window.__tt = setTimeout(function(){ t.classList.remove('show'); }, 2300);
}
function fmtTime(ts){
  var m = Math.round((Date.now()-ts)/60000);
  if(m < 1) return '刚刚';
  if(m < 60) return m + ' 分钟前';
  if(m < 1440) return Math.floor(m/60) + ' 小时前';
  return Math.floor(m/1440) + ' 天前';
}
function money(n){ return (Math.round(n*100)/100).toFixed(2).replace(/\.00$/,''); }
function level(s){ return s>=85 ? 'L3' : (s>=70 ? 'L2' : 'L1'); }
function levelWord(s){ return s>=85 ? '可信住户' : (s>=70 ? '正常接单' : '仅限公益'); }
function platformFee(fee){ return Math.min(PLATFORM_CAP, Math.round(fee*PLATFORM_RATE*100)/100); }
function statusText(s){ return ({open:'待接单', taken:'进行中', delivered:'待确认', confirmed:'已完成', closed:'已关闭'})[s] || s; }
function isLead(){ return db.user.role === 'lead'; }
function fitScore(t){
  var s = 0, u = db.user;
  if(t.building === u.building) s += 3;
  if(/12:00|17:30/.test(t.slot)) s += 2;
  if(t.type === 'express') s += 1;
  return s;
}
function fitWord(t){
  var s = fitScore(t);
  return s>=5 ? '极顺路' : (s>=3 ? '顺路' : (s>=2 ? '稍绕' : '不顺路'));
}
function taskById(id){ return db.tasks.filter(function(x){ return x.id===id; })[0]; }
function toolById(id){ return db.items.filter(function(x){ return x.id===id; })[0]; }
function docById(id){ return db.docs.filter(function(x){ return x.id===id; })[0]; }
function ledgerSum(kind){ return db.ledger.filter(function(l){ return l.kind===kind; }).reduce(function(a,l){ return a + l.amount; }, 0); }

function viewMarket(){
  var u = db.user, lead = isLead();
  var list = db.tasks.filter(function(t){ return t.type !== 'help'; });
  if(lead){
    list = list.filter(function(t){ return t.building === u.building && t.status !== 'closed'; });
  } else {
    /* 大厅只放还没人接的单：被接走即从大厅消失，转到接单人的「我的接单」 */
    list = list.filter(function(t){ return t.status === 'open'; });
  }
  var shown = list.filter(function(t){ return filter.market==='all' || t.type===filter.market; });
  shown.sort(function(a,b){
    var am = (a.status==='open')?1:0, bm = (b.status==='open')?1:0;
    if(am !== bm) return bm - am;
    var sa = fitScore(a), sb = fitScore(b);
    if(sa !== sb) return sb - sa;
    return b.createdAt - a.createdAt;
  });
  var catList = CATS.filter(function(c){ return c.k!=='help'; }).map(function(c){
    return {k:c.k, n:c.n, count:list.filter(function(t){ return t.type===c.k; }).length};
  });

  var body =
    '<div class="page-head"><div><div class="eyebrow">任务集市 · ' + list.length + ' 条</div>' +
      '<div class="h1 mt6">' + (lead ? esc(u.building) + ' 本栋需求' : '任务集市') + '</div></div>' +
      '<div class="spacer"></div>' + (lead ? '<span class="demo-tag">仅本栋</span>' : '') + '</div>' +

    '<div class="grid">' + (shown.length ? shown.map(taskCard).join('') : '<div class="empty">这个分类暂时没有任务</div>') + '</div>';
  return layout('market', body);
}

/* 隐私：取件码 / 门牌只对发起人和接单人可见 */
var LOCK_SVG = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4.5" y="10.5" width="15" height="9.5" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>';
function codeVisible(t){
  var u = db.user;
  if(!t.code) return false;
  if(t.from === u.name) return true;
  if(isLead()) return false;
  if(t.taker === u.name && (t.status==='taken' || t.status==='delivered' || t.status==='confirmed')) return true;
  return false;
}

function taskCard(t){
  var u = db.user, lead = isLead();
  var mine = (t.from === u.name);
  var isTaker = (t.taker === u.name);
  var codeShown = codeVisible(t);
  var head = '<div class="head"><span class="cat">' + catName(t.type) + '</span><div class="spacer"></div>' +
    '<span class="status ' + (t.status==='open'?'open':(t.status==='confirmed'||t.status==='closed'?'done':'')) + '"><i></i>' + statusText(t.status) + '</span></div>';

  var price = '';
  if(t.mode === 'paid') price = '<span class="tag cash">有偿 · ' + money(t.fee) + ' 元</span>';
  else price = '<span class="tag">公益 · 1 时间币</span>';
  if(!t.verified) price += ' <span class="tag warn">待核验</span>';

  var actions = '';
  if(lead){
    actions = (!t.verified ? '<button class="btn sm" data-act="verify" data-id="' + t.id + '">核验</button>' : '') +
      (t.status==='confirmed' ? '<span class="note">已结算</span>' : '<button class="btn gray sm" data-act="mediate" data-id="' + t.id + '">下架</button>');
  } else if(t.status === 'delivered' && (mine || isTaker)){
    actions = '<button class="btn sm" data-act="confirm" data-id="' + t.id + '">确认收货并结算</button>';
  } else if(mine && t.status === 'open'){
    actions = '<button class="btn gray sm" data-act="cancel" data-id="' + t.id + '">撤回</button>';
  } else if(mine && t.status === 'taken'){
    actions = '<span class="note">' + esc(t.taker||'') + ' 正在办</span>';
  } else if(!mine && t.status === 'open'){
    actions = '<button class="btn sm" data-act="take" data-id="' + t.id + '">我要接这单</button>';
  } else if(isTaker && t.status === 'taken'){
    actions = '<button class="btn sm" data-act="deliver" data-id="' + t.id + '">我已送达</button>';
  } else if(t.status === 'confirmed'){
    actions = '<span class="note">已结算 · 信用 +2</span>';
  } else if(isTaker){
    actions = '<span class="note">你接的单，等对方确认</span>';
  }

  return '<div class="card task hover">' + head +
    '<div class="title">' + esc(t.title) + '</div>' +
    '<div class="meta">' + esc(t.from) + '<span class="dot"></span>' + esc(t.building) + '<span class="dot"></span>' + esc(t.slot) + '</div>' +
    (t.code ? (codeShown
        ? '<div class="meta mt6">取件码　<b class="code">' + esc(t.code) + '</b>' + (isTaker && !mine ? '<span class="lock ok">已解锁</span>' : '') + '</div>'
        : '<div class="meta mt6">取件码　<span class="lock">' + LOCK_SVG + '接单后可见</span></div>') : '') +
    (t.note ? '<div class="note mt10">' + esc(t.note) + '</div>' : '') +
    '<div class="foot"><div class="row" style="gap:8px">' + actions + '</div><div class="row" style="gap:8px">' + price +
      '<span class="mini">' + (t.status==='open' && !mine && !lead ? '顺路分 ' + fitScore(t) + ' · ' : '') + fmtTime(t.createdAt) + '</span></div></div>' +
  '</div>';
}

function openPublish(pref){

  var types = CATS.map(function(c){
    return '<option value="' + c.k + '"' + (pref===c.k?' selected':'') + '>' + c.n + '</option>';
  }).join('');
  document.getElementById('modalBox').innerHTML =
    '<div class="eyebrow">发布需求</div>' +
    '<div class="h1 mt6" style="font-size:20px">一句话说清，顺路的人会接</div>' +
    '<label class="f">分类</label><select id="p-type">' + types + '</select>' +
    '<label class="f">一句话说明 <span style="color:#A05A45">必填</span></label><input id="p-title" placeholder="如：三号门取圆通 1 件">' +
    '<label class="f">取件楼栋 / 地点 <span style="color:#A05A45">必填</span></label>' +
    '<input id="p-bd" list="bd-list" value="' + esc(db.user.building) + '" placeholder="如：3 宿舍、东区三号门驿站">' +
    '<datalist id="bd-list">' + BUILDINGS.map(function(b){ return '<option value="' + b + '">'; }).join('') + '</datalist>' +
    '<div class="row mt10"><div style="flex:1"><label class="f" style="margin-top:0">取件码 / 门牌 <span class="lock" style="margin-left:6px">' + LOCK_SVG + '仅接单人可见</span></label><input id="p-code" placeholder="可选，如 8-2-3021"></div>' +
      '<div style="flex:1"><label class="f" style="margin-top:0">时间段 <span style="color:#A05A45">可自填</span></label>' +
      '<input id="p-slot" list="slot-list" value="12:00–13:00" placeholder="如 12:00–13:00、18:30 前">' +
      '<datalist id="slot-list"><option value="现在"><option value="12:00–13:00"><option value="17:30–18:30"><option value="20:00–21:00"><option value="今天 18:30 前"><option value="明天上午"></datalist></div></div>' +
    '<label class="f">结算方式</label>' +
    '<div class="seg" style="width:100%;padding:4px;margin-bottom:2px">' +
      '<button type="button" id="p-mode-free" class="on" style="flex:1;padding:8px">公益 · 记 1 时间币</button>' +
      '<button type="button" id="p-mode-paid" style="flex:1;padding:8px">有偿 · 报酬自填</button></div>' +
    '<div id="p-paid-box" style="display:none"><label class="f">报酬金额（元）<span style="color:#A05A45">必填</span></label>' +
      '<input id="p-fee" inputmode="decimal" placeholder="如 3" value="3">' +
      '<div class="note mt6">接单人实得 <b id="p-net">2.85</b> 元（平台 5%，封顶 3 元）</div></div>' +
    '<label class="f">补充说明</label><textarea id="p-note" placeholder="楼层、件数、注意事项"></textarea>' +
    '<div class="field-err" id="p-err"></div>' +
    '<div class="row mt18" style="justify-content:flex-end"><button class="btn gray" data-act="close-modal">取消</button><button class="btn" id="p-submit">发布</button></div>';
  document.getElementById('modal').classList.add('on');

  var mode = 'free';
  var bFree = document.getElementById('p-mode-free'), bPaid = document.getElementById('p-mode-paid');
  var box = document.getElementById('p-paid-box'), feeInput = document.getElementById('p-fee');
  function paint(){
    bFree.classList.toggle('on', mode==='free');
    bPaid.classList.toggle('on', mode==='paid');
    box.style.display = mode==='paid' ? 'block' : 'none';
    var f = parseFloat(feeInput.value);
    document.getElementById('p-net').textContent = isFinite(f) && f>0 ? money(f - platformFee(f)) : '—';
  }
  bFree.onclick = function(){ mode='free'; paint(); };
  bPaid.onclick = function(){ mode='paid'; paint(); };
  feeInput.oninput = paint;
  document.getElementById('p-type').onchange = function(){
    if(this.value === 'help'){ mode = 'free'; paint(); }
  };

  document.getElementById('p-submit').onclick = function(){
    var type = document.getElementById('p-type').value;
    var title = document.getElementById('p-title').value.trim();
    var bd = document.getElementById('p-bd').value.trim();
    var code = document.getElementById('p-code').value.trim();
    var slot = document.getElementById('p-slot').value.trim();
    var note = document.getElementById('p-note').value.trim();
    var err = document.getElementById('p-err');
    if(title.length < 4){ err.textContent = '说明太短，写清要办什么'; return; }
    if(!bd){ err.textContent = '楼栋 / 地点必填，写清别人去哪取'; return; }
    if(!slot){ err.textContent = '时间段填一个，比如 12:00–13:00'; return; }
    if(type === 'help' && mode === 'paid'){ err.textContent = '帮扶单固定走公益轨道，不能标价'; return; }
    var fee = 0;
    if(mode === 'paid'){
      fee = parseFloat(feeInput.value);
      if(!isFinite(fee) || fee <= 0){ err.textContent = '有偿单要填报酬金额'; return; }
      if(fee > 50){ err.textContent = '单笔报酬建议不超过 50 元，太高就变味了'; return; }
      fee = Math.round(fee*100)/100;
    }
    db.tasks.unshift({id:uid('t'), type:type, title:title, from:db.user.name, building:bd, slot:slot,
      mode:mode, fee:fee, code:code, note:note, status:'open', verified:false, createdAt:Date.now()});
    save(); closeModal(); render();
    toast('已发布，邻长核验后进入推荐位');
  };
}

/* ================= 流程 ================= */
/* ================= 接单：先过学号验证，再进「我的接单」 ================= */
function activeCount(){
  return db.tasks.filter(function(x){ return x.taker===db.user.name && (x.status==='taken'||x.status==='delivered'); }).length;
}
function openVerify(id){
  var t = taskById(id);
  if(!t) return toast('任务不存在');
  if(isLead()) return toast('邻长视角不参与接单');
  if(t.status !== 'open') return toast('这单已被接走');
  if(t.from === db.user.name) return toast('不能接自己发布的单');
  if(db.user.score < 60 && t.mode === 'paid') return toast('信用低于 60，只能接公益单');
  if(activeCount() >= 3) return toast('已有 3 单在进行中，送达确认后再接');

  var brief = '<div class="pick mt10"><div class="pk">' + catName(t.type) + '</div><div style="flex:1">' +
      '<b style="font-weight:600">' + esc(t.title) + '</b>' +
      '<div class="meta">' + esc(t.from) + ' · ' + esc(t.building) + ' · ' + esc(t.slot) + '</div></div></div>';

  if(db.user.sidVerified){
    document.getElementById('modalBox').innerHTML =
      '<div class="eyebrow">接单确认</div>' +
      '<div class="h1 mt6" style="font-size:20px">学号已验证，确认接这一单</div>' +
      '<div class="note mt6">身份只核一次，之后接单不再重复填写。</div>' +
      brief +
      '<div class="meta mt10">已验证学号 <b class="code">' + sidMask(db.user.sid) + '</b></div>' +
      '<div class="row mt20" style="justify-content:flex-end;gap:8px"><button class="btn gray" data-act="close-modal">取消</button>' +
        '<button class="btn" data-act="take-ok" data-id="' + t.id + '">确认接单</button></div>';
  } else {
    document.getElementById('modalBox').innerHTML =
      '<div class="eyebrow">接单验证</div>' +
      '<div class="h1 mt6" style="font-size:20px">先核对学号，再领这一单</div>' +
      '<div class="note mt6">只用来确认你是本校在读住户，验证后对外只显示尾号。</div>' +
      brief +
      '<label class="f">学号 <span style="color:#A05A45">必填 · 8–12 位数字</span></label>' +
      '<input id="v-sid" inputmode="numeric" autocomplete="off" placeholder="如 2023110112">' +
      '<div class="field-err" id="v-err"></div>' +
      '<div class="row mt20" style="justify-content:flex-end;gap:8px"><button class="btn gray" data-act="close-modal">取消</button>' +
        '<button class="btn" data-act="verify-do" data-id="' + t.id + '">验证并接单</button></div>';
  }
  document.getElementById('modal').classList.add('on');
}

function sidMask(sid){
  sid = String(sid || '');
  return sid.length >= 4 ? '****' + sid.slice(-4) : '****';
}

function verifyAndTake(id){
  var input = document.getElementById('v-sid');
  var err = document.getElementById('v-err');
  var val = input ? String(input.value).replace(/\s/g,'') : '';
  if(!sidValid(val)){
    if(err) err.textContent = '学号应为 8–12 位数字，请再核对一次';
    if(input) input.focus();
    return;
  }
  db.user.sid = val; db.user.sidVerified = true;
  doTake(id, true);
}

function doTake(id, verifiedNow){
  var t = taskById(id);
  if(!t) return toast('任务不存在');
  if(t.status !== 'open') return toast('这单已被接走');
  if(t.from === db.user.name) return toast('不能接自己发布的单');
  if(db.user.score < 60 && t.mode === 'paid') return toast('信用低于 60，只能接公益单');
  if(activeCount() >= 3) return toast('已有 3 单在进行中，送达确认后再接');
  t.status = 'taken'; t.taker = db.user.name; t.takerBuilding = db.user.building;
  t.takenAt = Date.now(); t.takerSid = db.user.sid;
  save(); closeModal();
  location.hash = '#doing';
  render();
  toast(verifiedNow ? '学号验证通过，接单成功' : '接单成功，去「我的接单」看取件码');
}

function sidValid(v){ return /^\d{8,12}$/.test(String(v || '').replace(/\s/g,'')); }

function openSelfVerify(){
  document.getElementById('modalBox').innerHTML =
    '<div class="eyebrow">学号验证</div>' +
    '<div class="h1 mt6" style="font-size:20px">验证一次，之后接单不再填</div>' +
    '<div class="note mt6">只用于确认本校在读身份，对外只显示尾号。</div>' +
    '<label class="f">学号 <span style="color:#A05A45">8–12 位数字</span></label>' +
    '<input id="v-sid2" inputmode="numeric" autocomplete="off" placeholder="如 2023110112" value="' + esc(db.user.sid || '') + '">' +
    '<div class="field-err" id="v-err2"></div>' +
    '<div class="row mt20" style="justify-content:flex-end;gap:8px"><button class="btn gray" data-act="close-modal">取消</button>' +
      '<button class="btn" data-act="verify-self-do">确认验证</button></div>';
  document.getElementById('modal').classList.add('on');
}

function verifySelf(){
  var input = document.getElementById('v-sid2'), err = document.getElementById('v-err2');
  var val = input ? String(input.value).replace(/\s/g,'') : '';
  if(!sidValid(val)){
    if(err) err.textContent = '学号应为 8–12 位数字，请再核对一次';
    if(input) input.focus();
    return;
  }
  db.user.sid = val; db.user.sidVerified = true;
  save(); closeModal(); render();
  toast('学号已验证 · ' + sidMask(val));
}

function dropTask(id){
  var t = taskById(id);
  if(!t || t.taker !== db.user.name || t.status !== 'taken') return toast('状态已变化，刷新看看');
  t.status = 'open'; delete t.taker; delete t.takerBuilding; delete t.takenAt; delete t.takerSid;
  save(); render(); toast('已放弃，这单回到任务集市');
}
function deliverTask(id){
  var t = taskById(id);
  if(!t || t.status !== 'taken' || t.taker !== db.user.name) return toast('状态已变化，刷新看看');
  t.status = 'delivered'; t.deliveredAt = Date.now(); save(); render();
  toast('已送达，等对方确认');
}
function confirmTask(id){
  var t = taskById(id);
  if(!t || t.status !== 'delivered') return toast('还没有待确认的送达');
  if(t.from !== db.user.name) return toast('等发布人确认收货');
  var takerBd = t.takerBuilding || t.building;
  var sameBuilding = (t.building === takerBd);
  var paid = (t.mode === 'paid' && !sameBuilding);
  var fee = paid ? t.fee : 0;
  var pf = paid ? platformFee(fee) : 0;

  t.status = 'confirmed'; t.confirmedAt = Date.now();
  db.user.score = Math.min(100, db.user.score + 2);
  if(paid){
    db.ledger.unshift({id:uid('l'), ts:Date.now(), text:'有偿单完成 · ' + t.title + ' ' + money(fee) + ' 元', kind:'cash', amount:fee - pf});
    db.ledger.unshift({id:uid('l'), ts:Date.now(), text:'服务费 · ' + money(fee) + ' 元 × 5%', kind:'fee', amount:pf});
  } else {
    db.user.coins += 1;
    db.ledger.unshift({id:uid('l'), ts:Date.now(), text:'公益单完成 · ' + t.title + (sameBuilding?'（同楼栋）':'') + '，+1 时间币', kind:'coin', amount:1});
  }
  save(); render();
  toast(paid ? '已结算 ' + money(fee) + ' 元，服务费 ' + money(pf) + ' 元' : '已结算：+1 时间币，信用 +2');
}
function cancelTask(id){
  var t = taskById(id);
  if(!t || t.status !== 'open') return toast('已经有人接了，不能撤回');
  t.status = 'closed'; save(); render(); toast('已撤回');
}

      } else if(g.status === 'reserved'){

      } else {
        btn = '<span class="tag gray">已售出</span>';

        '<div class="row between mt10"><div class="title" style="margin-top:0">' + esc(g.title) + '</div><span class="price">' + money(g.price) + '<small>元</small></span></div>' +
        '<div class="meta mt6">' + esc(g.cond) + '<span class="dot"></span>' + esc(g.owner) + '<span class="dot"></span>' + esc(g.building) + '</div>' +
        '<div class="note mt10">' + esc(g.note) + '</div>' +
        '<div class="foot"><div class="row" style="gap:8px">' + btn + '</div><span class="mini">' + (g.status==='sold'?'已成交':'面交：' + esc(g.building) + ' 楼下') + '</span></div></div>';

function docGet(id){
  var d = docById(id);
  if(!d) return toast('资料不存在');
  if(db.credits <= 0) return toast('额度不够：先上传一份资料换额度');
  db.credits -= 1; d.downloads += 1;
  db.ledger.unshift({id:uid('l'), ts:Date.now(), text:'额度支出：取用《' + d.title + '》', kind:'credit', amount:-1});
  save(); render(); toast('已开始下载');
}

    '</div>' +
    '<div class="section mt20"><div class="h2">四个模块的使用情况</div><table class="tb mt10"><thead><tr><th>模块</th><th>条目</th><th>说明</th></tr></thead><tbody>' +
      '<tr><td>快递代取 / 代买 / 打印 / 借用</td><td>' + all.filter(function(t){return t.type!=='help';}).length + '</td><td class="note">按顺路分匹配，同楼栋免费，跨楼栋才计费</td></tr>' +
      '<tr><td>闲置流转</td><td>' + db.items.length + '</td><td class="note">平台不经手钱，当面验货</td></tr>' +
      '<tr><td>资料共享</td><td>' + db.docs.length + '</td><td class="note">上传换额度，带署名与取用者水印</td></tr>' +
      '<tr><td>临时帮扶</td><td>' + all.filter(function(t){return t.type==='help';}).length + '</td><td class="note">固定公益轨道，不标价</td></tr>' +
    '</tbody></table></div>';
  return layout('data', body);
}

/* ================= 身份 ================= */
function openIdentity(){
  var u = db.user;
  document.getElementById('modalBox').innerHTML =
    '<div class="eyebrow">体验身份</div>' +
    '<div class="h1 mt6" style="font-size:20px">游客体验，不登录</div>' +
    '<label class="f">所在楼栋 / 区域</label><input id="i-bd" value="' + esc(u.building) + '" placeholder="如：3 宿舍">' +
    '<div class="note mt10">姓名固定为「' + ME + '」，视角在右上角切换。</div>' +
    '<div class="row mt18" style="justify-content:flex-end"><button class="btn gray" data-act="close-modal">取消</button><button class="btn" id="i-save">保存</button></div>';
  document.getElementById('modal').classList.add('on');
  document.getElementById('i-save').onclick = function(){
    var bd = document.getElementById('i-bd').value.trim();
    if(!bd) return toast('楼栋不能为空');
    db.user.building = bd;
    save(); closeModal(); render(); toast('已切换到 ' + bd);
  };
}

function setRole(r){
  if(db.user.role === r) return;
  db.user.role = r;
  save();
  var map = {home:'#home', market:'#market'};
  if(r === 'lead'){
    if(['#lead','#data'].indexOf(location.hash) < 0) location.hash = '#lead';
  } else {
    if(['#lead','#data'].indexOf(location.hash) >= 0) location.hash = '#home';
  }
  render();
  toast(r === 'lead' ? '已切换为邻长视角（演示用）' : '已切换为学生视角');
}

/* ================= 路由 ================= */
function closeModal(){ document.getElementById('modal').classList.remove('on'); }

function render(){
  var app = document.getElementById('app');
  var v = (location.hash || '#home').replace('#','');
  if(!isLead() && (v === 'lead' || v === 'data')) v = 'home';
  var html;
  if(v === 'market') html = viewMarket();
  else if(v === 'doing') html = isLead() ? viewMarket() : viewDoing();
  else if(v === 'goods') html = viewGoods();
  else if(v === 'docs') html = viewDocs();
  else if(v === 'help') html = viewHelp();
  else if(v === 'me') html = viewMe();
  else if(v === 'lead') html = viewLead();
  else if(v === 'data') html = viewData();
  else html = isLead() ? viewHomeLead() : viewHomeStudent();
  app.innerHTML = html;
  revealInit();
  enterInit();
}

/* 首屏一次性入场：只给第一屏的 6 个块，64ms 递进，reduced-motion 直接跳过；
   只在本次加载的第一次渲染跑，之后切页不再重复，避免每次导航都等一秒 */
var _enterDone = false;
function enterInit(){
  if(_enterDone) return;
  var reduce = false;
  try{ reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
  if(reduce) return;
  var innerEl = document.querySelector('#app .inner');
  if(!innerEl) return;
  var kids = [], cs = innerEl.children, k;
  for(var i = 0; i < cs.length && kids.length < 6; i++){
    var cn = String(cs[i].className || '');
    if(!cn || cn.indexOf('topbar') >= 0 || cn.indexOf('reveal') >= 0) continue;
    kids.push(cs[i]);
  }
  for(k = 0; k < kids.length; k++){
    kids[k].style.setProperty('--d', (k * 64) + 'ms');
    kids[k].classList.add('enter');
  }
  _enterDone = true;
}

document.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]');
  if(!el) return;
  var act = el.getAttribute('data-act');
  var id = el.getAttribute('data-id');

  if(act === 'close-modal'){ closeModal(); return; }
  if(act === 'identity'){ openIdentity(); return; }
  if(act === 'role'){ setRole(el.getAttribute('data-v')); return; }
  if(act === 'open-publish'){ openPublish(el.getAttribute('data-type')); return; }
  if(act === 'open-goods'){ openGoods(); return; }
  if(act === 'open-doc'){ openDoc(); return; }
  if(act === 'take'){ openVerify(id); return; }
  if(act === 'take-ok'){ doTake(id); return; }
  if(act === 'verify-do'){ verifyAndTake(id); return; }
  if(act === 'verify-self'){ openSelfVerify(); return; }
  if(act === 'verify-self-do'){ verifySelf(); return; }
  if(act === 'drop'){ dropTask(id); return; }
  if(act === 'contact'){ toast('演示版不接真实电话，约在楼下当面交接即可'); return; }
  if(act === 'copy-code'){
    var cd = el.getAttribute('data-code') || '';
    var done = function(){ toast('已复制取件码：' + cd); };
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(cd).then(done, function(){ toast('取件码：' + cd); });
      } else { toast('取件码：' + cd); }
    }catch(e){ toast('取件码：' + cd); }
    return;
  }
  if(act === 'deliver'){ deliverTask(id); return; }
  if(act === 'confirm'){ confirmTask(id); return; }
  if(act === 'cancel'){ cancelTask(id); return; }
  if(act === 'doc-get'){ docGet(id); return; }
  if(act === 'filter'){ filter[el.getAttribute('data-key')] = el.getAttribute('data-val'); render(); return; }
  if(act === 'reset'){
    db = seed(); save(); filter = {market:'all', goods:'all', docs:'all'};
    location.hash = '#home'; render(); toast('演示数据已重置'); return;
  }
  if(act === 'goods-res'){
    var g = toolById(id);
    if(!g || g.status !== 'onsale') return toast('这件已经被人订了');
    if(g.owner === db.user.name) return toast('这是你自己发布的');
    g.status = 'reserved'; g.buyer = db.user.name; save(); render();
    toast('已约面交，楼下见'); return;
  }
  if(act === 'goods-sold'){
    var g2 = toolById(id);
    if(!g2) return toast('物品不存在');
    if(g2.owner !== db.user.name) return toast('只有发布者能确认成交');
    g2.status = 'sold'; save(); render(); toast('已完成面交'); return;
  }
  if(act === 'verify'){
    if(!isLead()) return toast('只有邻长视角可以核验');
    var t = taskById(id);
    if(!t) return toast('任务不存在');
    if(t.building !== db.user.building) return toast('只能核验本栋需求');
    t.verified = true; save(); render(); toast('已核验'); return;
  }
  if(act === 'mediate'){
    if(!isLead()) return toast('只有邻长视角可以下架');
    var t2 = taskById(id);
    if(!t2) return toast('任务不存在');
    if(t2.building !== db.user.building) return toast('只能处理本栋需求');
    t2.status = 'closed'; save(); render(); toast('已关闭该单'); return;
  }
});

document.getElementById('modal').addEventListener('click', function(e){
  if(e.target === this) closeModal();
});
document.addEventListener('pointerdown', function(e){
  var b = e.target.closest('.btn');
  if(!b) return;
  var r = b.getBoundingClientRect(), d = Math.max(r.width, r.height);
  var s = document.createElement('span'); s.className = 'rip';
  s.style.width = s.style.height = d + 'px';
  s.style.left = (e.clientX - r.left - d/2) + 'px';
  s.style.top = (e.clientY - r.top - d/2) + 'px';
  b.appendChild(s);
  setTimeout(function(){ if(s.parentNode) s.parentNode.removeChild(s); }, 560);
});
window.addEventListener('hashchange', render);
document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeModal(); });

/* ================= 进场：位移 + 淡入，逐词点亮 ================= */
var _obs = [];
function revealInit(){
  for(var i=0;i<_obs.length;i++){ try{ _obs[i].disconnect(); }catch(e){} }
  _obs = [];
  var reduce = false;
  try{ reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
  var blocks = document.querySelectorAll('.metrics,.grid4,.grid,.grid3,.section,.page-head,.tagline');
  var words = document.querySelectorAll('.tagline .w');
  var vh = window.innerHeight || 800;
  function onScreen(el){
    var r = el.getBoundingClientRect();
    return r.top < vh - 56 && r.bottom > 0;
  }
  function showAll(){
    for(var a=0;a<blocks.length;a++) blocks[a].classList.remove('reveal');
    for(var b=0;b<words.length;b++) words[b].classList.add('on');
  }
  if(reduce || typeof IntersectionObserver === 'undefined'){ showAll(); return; }
  var io = new IntersectionObserver(function(es){
    for(var i=0;i<es.length;i++){
      if(es[i].isIntersecting){ es[i].target.classList.add('in'); io.unobserve(es[i].target); }
    }
  }, {threshold:0.06, rootMargin:'0px 0px -6% 0px'});
  var pending = [];
  for(var k=0;k<blocks.length;k++){
    if(onScreen(blocks[k])) continue;          /* 已在首屏：直接呈现，不做隐藏 */
    blocks[k].classList.add('reveal');
    io.observe(blocks[k]);
    pending.push(blocks[k]);
  }
  _obs.push(io);
  var io2 = null;
  if(words.length){
    var tagEl = document.querySelectorAll('.tagline')[0] || words[0];
    if(onScreen(tagEl)){
      /* 已在首屏：略作停顿后逐词点亮，保证演示时看得到节奏 */
      for(var n=0;n<words.length;n++){
        words[n].style.transitionDelay = (n*110) + 'ms';
        pending.push(words[n]);
      }
      setTimeout(function(){
        for(var q=0;q<words.length;q++) words[q].classList.add('on');
      }, 260);
    } else {
      io2 = new IntersectionObserver(function(es){
        for(var i=0;i<es.length;i++){
          if(es[i].isIntersecting){ es[i].target.classList.add('on'); io2.unobserve(es[i].target); }
        }
      }, {threshold:0.6});
      for(var m=0;m<words.length;m++){ io2.observe(words[m]); pending.push(words[m]); }
      _obs.push(io2);
    }
  }
  /* 兜底：1.8 秒后仍未点亮的一律显示，避免演示时内容缺块 */
  if(pending.length){
    setTimeout(function(){
      for(var p=0;p<pending.length;p++){ pending[p].classList.add('in'); pending[p].classList.add('on'); }
    }, 1800);
  }
}

render();
